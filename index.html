<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Süti katalógus</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍰 Süti katalógus</h1>

  <div class="tabs">
    <button class="tab active" data-cat="edes">🍪 Édes</button>
    <button class="tab" data-cat="sos">🥐 Sós</button>
    <button class="tab" data-cat="torta">🎂 Torták</button>
  </div>
</header>

<main>
  <div class="gallery" id="gallery"></div>
</main>

<div class="lightbox" id="lightbox">
  <span class="close" id="close">&times;</span>

  <div class="arrow left" onclick="prevImage()">❮</div>
  <img id="lightbox-img">
  <div class="arrow right" onclick="nextImage()">❯</div>
</div>

<script src="script.js"></script>
</body>
</html>
